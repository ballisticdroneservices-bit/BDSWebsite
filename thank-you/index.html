<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanks — Ballistic Drone Services</title>

  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #111111;
      --border: #262626;
      --text: #e5e5e5;
      --muted: #9ca3af;
      --accent: #f97316; /* brand orange */
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: linear-gradient(180deg, #111 0%, #0d0d0d 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    .logo {
      max-width: 180px;
      margin: 0 auto 24px;
      display: block;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.75rem;
      font-weight: 700;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--accent);
      color: #111;
      font-weight: 600;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(249,115,22,0.35);
    }

    footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <img src="/assets/BDS Chevrons FB Banner.jpg" alt="Ballistic Drone Services" class="logo" />

      <h1>Thanks — request received.</h1>

      <p>
        I’ll reply within <strong>1 business day</strong>.<br />
        If it’s urgent, feel free to call or text.
      </p>

      <a href="/" class="btn">Back to site</a>

      <footer>
        © <span id="year"></span> Ballistic Drone Services
      </footer>

    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
